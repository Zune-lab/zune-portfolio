# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen && open ZunePortfolio.xcodeproj
name: ZunePortfolio
options:
  bundleIdPrefix: dev.zune
  deploymentTarget:
    iOS: "16.0"
targets:
  ZunePortfolio:
    type: application
    platform: iOS
    sources: [ZunePortfolio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zune.portfolio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: zune.dev
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
