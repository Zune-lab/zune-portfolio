<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zune — Web Developer</title>
    <meta name="description" content="Zune's portfolio: a web developer building small, playful things with React." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zune — Web Developer" />
    <meta property="og:description" content="Zune's portfolio: a web developer building small, playful things with React." />
    <meta property="og:url" content="https://zune-lab.github.io/zune-portfolio/" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0a0c10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved theme before paint, so there's no flash on load.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('zune-theme');
        } catch (e) {} // storage bị chặn: dùng mặc định dark
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
