<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zune — Web Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved theme before paint, so there's no flash on load.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('zune-theme');
        } catch (e) {} // storage bị chặn: dùng mặc định dark
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
