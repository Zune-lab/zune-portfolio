<!doctype html>
<!--
  {{repo}} © {{year}} {{name}} ({{githubUrl}})
  Code: MIT License, keep the copyright notice. Personal content: all rights reserved.
  Original: {{repoUrl}}
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <meta name="author" content="{{name}}" />
    <meta name="copyright" content="© {{year}} {{name}}" />
    <meta name="description" content="{{description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{siteUrl}}" />
    <meta property="og:site_name" content="{{handle}}" />
    <meta property="og:image" content="{{siteUrl}}og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="{{siteUrl}}og.png" />
    <meta name="theme-color" content="#0a0c10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- font tải không chặn render: media=print -> đổi thành all khi tải xong (display=swap nên chữ hiện ngay bằng font dự phòng) -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&family=Silkscreen:wght@400;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      // Apply saved theme before paint, so there's no flash on load.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('{{themeKey}}');
        } catch (e) {} // storage bị chặn: dùng mặc định dark
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
