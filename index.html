<!doctype html>
<!--
  {{repo}} © {{year}} {{name}} ({{githubUrl}})
  Code: MIT License, keep the copyright notice. Personal content: all rights reserved.
  Original: {{repoUrl}}
-->
<html lang="en" data-theme="dark" data-skin="{{defaultSkin}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <meta name="author" content="{{name}}" />
    <meta name="copyright" content="© {{year}} {{name}}" />
    <meta name="description" content="{{description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{siteUrl}}" />
    <meta property="og:site_name" content="{{handle}}" />
    <meta property="og:image" content="{{siteUrl}}og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="{{siteUrl}}og.png" />
    <meta name="theme-color" content="#0a0c10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- font tải không chặn render: media=print -> đổi thành all khi tải xong (display=swap nên chữ hiện ngay bằng font dự phòng) -->
    <link
      href="{{fontsUrl}}"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="{{fontsUrl}}"
        rel="stylesheet"
      />
    </noscript>
    <script>
      // Apply saved skin + theme before paint, so there's no flash on load.
      // Skin chỉ có 1 chế độ sáng/tối thì ÉP theme theo nó (cùng quy tắc với src/lib/skin.js); 'auto' dùng skin đã áp dụng lần trước.
      (function () {
        var saved = null,
          skin = null,
          eff = null;
        try {
          saved = localStorage.getItem('{{themeKey}}');
          skin = localStorage.getItem('{{skinKey}}');
          eff = localStorage.getItem('{{skinEffKey}}');
        } catch (e) {} // storage bị chặn: dùng mặc định (skin gốc, dark)
        var ids = '{{skinIds}}'.split(',');
        var locks = '{{skinLocks}}'.split(',');
        if (skin === 'auto') skin = eff;
        if (ids.indexOf(skin) < 0) skin = '{{defaultSkin}}';
        var theme = saved === 'light' ? 'light' : 'dark';
        for (var i = 0; i < locks.length; i++) {
          var p = locks[i].split(':');
          if (p[0] === skin) theme = p[1];
        }
        document.documentElement.dataset.skin = skin;
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
